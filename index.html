<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎉 Mis 15 Años 🎉</title>
  
  <!-- SweetAlert2 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.12.4/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>🎉 ¡Bienvenidos a mis 15 años! 🎉</h1>
    <p class="subtitle">Captura este momento mágico conmigo ✨</p>

    <button id="cameraBtn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24">
        <path d="M12 9a3 3 0 100 6 3 3 0 000-6z"/>
        <path fill-rule="evenodd" d="M9.828 4a3 3 0 012.121.879l.95.95h3.1A2 2 0 0118 7.828v8.344a2 2 0 01-1.999 2h-8.002A2 2 0 016 16.172V7.828A2 2 0 017.828 6h3.1l.95-.95A3 3 0 019.828 4zM12 15a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
      Tomar Foto
    </button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <img id="preview" alt="Foto tomada"/>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Guardando tu foto mágica... ✨</p>
    </div>
  </div>

  <div class="countdown" id="countdown"></div>

  <script>
    // Crear burbujas animadas
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      
      const size = Math.random() * 60 + 20;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * window.innerWidth + 'px';
      bubble.style.bottom = '-100px';
      
      const duration = Math.random() * 3 + 3;
      bubble.style.animationDuration = duration + 's';
      
      const delay = Math.random() * 2;
      bubble.style.animationDelay = delay + 's';
      
      document.body.appendChild(bubble);
      
      setTimeout(() => {
        if (bubble.parentNode) {
          bubble.parentNode.removeChild(bubble);
        }
      }, (duration + delay) * 1000);
    }

    // Crear burbujas cada 800ms
    setInterval(createBubble, 800);

    // Variables principales
    const cameraBtn = document.getElementById('cameraBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const countdown = document.getElementById('countdown');
    const loading = document.getElementById('loading');
    
    const urlApi = 'https://api-save-image-qr-production.up.railway.app/api/upload';

    // Función para mostrar countdown
    function showCountdown(seconds) {
      return new Promise((resolve) => {
        countdown.style.display = 'block';
        let count = seconds;
        
        const updateCountdown = () => {
          countdown.textContent = count;
          if (count > 0) {
            count--;
            setTimeout(updateCountdown, 1000);
          } else {
            countdown.style.display = 'none';
            resolve();
          }
        };
        
        updateCountdown();
      });
    }

    cameraBtn.addEventListener('click', async () => {
      try {
        // Mostrar alerta de preparación
        const result = await Swal.fire({
          title: '📸 ¡Hora de brillar!',
          text: '¿Estás lista para tomar una foto increíble?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: '¡Sí, vamos! ✨',
          cancelButtonText: 'Mejor después',
          background: 'rgba(255, 255, 255, 0.95)',
          backdrop: 'rgba(0, 0, 0, 0.4)',
          confirmButtonColor: '#ff6b6b',
          cancelButtonColor: '#95a5a6'
        });

        if (!result.isConfirmed) return;

        console.log('📸 Iniciando cámara...');
        
        // Mostrar loading suave
        await Swal.fire({
          title: 'Preparando la cámara...',
          html: 'Un momento mientras todo se pone perfecto ✨',
          timer: 1500,
          timerProgressBar: true,
          didOpen: () => {
            Swal.showLoading();
          },
          showConfirmButton: false
        });

        // Solicitar cámara trasera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1200 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = 'block';
        cameraBtn.style.display = 'none';

        // Mostrar instrucciones
        await Swal.fire({
          title: '📱 ¡Perfecto!',
          text: 'La foto se tomará automáticamente en 5 segundos. ¡Sonríe! 😊',
          icon: 'success',
          timer: 2000,
          showConfirmButton: false,
          background: 'rgba(255, 255, 255, 0.95)',
          backdrop: 'rgba(0, 0, 0, 0.4)'
        });

        // Countdown visual
        await showCountdown(5);

        console.log('📷 Tomando foto...');
        
        // Tomar la foto
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        preview.src = dataUrl;
        preview.style.display = 'block';

        // Detener cámara
        video.srcObject.getTracks().forEach(track => track.stop());
        video.style.display = 'none';
        cameraBtn.style.display = 'flex';

        // Mostrar loading para subida
        loading.style.display = 'block';

        console.log('📤 Enviando imagen al servidor...');

        // Enviar al backend
        const response = await fetch(urlApi, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image: dataUrl })
        });

        loading.style.display = 'none';

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log('✅ Respuesta exitosa:', data);

        if (data.success) {
          await Swal.fire({
            title: '🎉 ¡Increíble!',
            text: 'Tu foto ha sido guardada con éxito. ¡Qué momento tan especial! ✨',
            icon: 'success',
            confirmButtonText: '¡Genial! 💖',
            background: 'rgba(255, 255, 255, 0.95)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            confirmButtonColor: '#ff6b6b',
            showClass: {
              popup: 'animate__animated animate__bounceIn'
            }
          });
        } else {
          throw new Error(data.error || "Error desconocido");
        }

      } catch (err) {
        loading.style.display = 'none';
        cameraBtn.style.display = 'flex';
        video.style.display = 'none';
        
        // Detener cámara si está activa
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
        }

        console.error('❌ Error:', err);
        
        let errorMessage = "Hubo un problema inesperado";
        let errorTitle = "Oops! 😅";
        
        if (err.name === 'NotAllowedError') {
          errorTitle = "Permisos de cámara";
          errorMessage = "Necesitamos acceso a tu cámara para tomar la foto. Por favor, permite el acceso y intenta de nuevo.";
        } else if (err.name === 'NotFoundError') {
          errorTitle = "Sin cámara";
          errorMessage = "No se encontró ninguna cámara en tu dispositivo.";
        } else if (err.message.includes('HTTP')) {
          errorTitle = "Error de conexión";
          errorMessage = "No se pudo guardar la foto. Revisa tu conexión a internet.";
        }

        await Swal.fire({
          title: errorTitle,
          text: errorMessage,
          icon: 'error',
          confirmButtonText: 'Entendido',
          background: 'rgba(255, 255, 255, 0.95)',
          backdrop: 'rgba(0, 0, 0, 0.4)',
          confirmButtonColor: '#ff6b6b'
        });
      }
    });

    // Agregar algunos efectos de interacción
    cameraBtn.addEventListener('mouseenter', () => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => createBubble(), i * 200);
      }
    });
  </script>
</body>
</html>
