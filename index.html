<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎉 Mis 15 Años 🎉</title>
  
  <!-- SweetAlert2 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.12.4/sweetalert2.all.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Animación de burbujas */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Contenedor principal */
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 10;
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: white;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.3);
      }
      to {
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 0.6);
      }
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      margin-bottom: 25px;
      font-style: italic;
    }

    /* Botones principales */
    .btn {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px auto;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 200px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
      background: linear-gradient(45deg, #ff5252, #e53935);
    }

    .btn:active {
      transform: translateY(0px);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: scale(1.1);
    }

    /* Botón de captura */
    .btn-capture {
      background: linear-gradient(45deg, #4caf50, #45a049);
      box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
      font-size: 1.1rem;
      padding: 18px 35px;
    }

    .btn-capture:hover {
      background: linear-gradient(45deg, #45a049, #388e3c);
      box-shadow: 0 12px 25px rgba(76, 175, 80, 0.4);
    }

    /* Selector de cámara */
    .camera-selector {
      display: none;
      margin: 20px 0;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .camera-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      min-width: 120px;
    }

    .camera-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .camera-btn.active {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      border-color: #ff6b6b;
    }

    /* Video y preview */
    #video {
      display: none;
      width: 100%;
      max-width: 350px;
      border-radius: 15px;
      margin: 20px 0;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    #preview {
      display: none;
      width: 100%;
      max-width: 350px;
      border-radius: 15px;
      margin: 20px 0;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
      animation: photoReveal 0.5s ease-out;
    }

    @keyframes photoReveal {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Loading spinner mejorado */
    .loading {
      display: none;
      margin: 20px 0;
      text-align: center;
    }

    .loading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading p {
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Responsive para móviles */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      .container {
        padding: 20px;
        border-radius: 20px;
        max-width: 95%;
      }
      
      h1 {
        font-size: 1.8rem;
        margin-bottom: 15px;
      }
      
      .subtitle {
        font-size: 1rem;
        margin-bottom: 20px;
      }
      
      .btn {
        padding: 12px 25px;
        font-size: 0.9rem;
        min-width: 180px;
        margin: 10px auto;
      }
      
      .btn-capture {
        padding: 15px 30px;
        font-size: 1rem;
      }
      
      #video, #preview {
        max-width: 100%;
        margin: 15px 0;
      }
      
      .camera-selector {
        gap: 8px;
      }
      
      .camera-btn {
        padding: 8px 16px;
        font-size: 0.8rem;
        min-width: 100px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .btn {
        min-width: 160px;
        padding: 10px 20px;
        font-size: 0.85rem;
      }
    }

    /* Estilo personalizado para SweetAlert - MÁS PEQUEÑO */
    .swal2-popup {
      border-radius: 20px !important;
      backdrop-filter: blur(20px) !important;
      background: rgba(255, 255, 255, 0.95) !important;
      width: 320px !important;
      padding: 20px !important;
    }

    .swal2-title {
      color: #667eea !important;
      font-weight: bold !important;
      font-size: 1.3rem !important;
      margin-bottom: 10px !important;
    }

    .swal2-html-container {
      font-size: 0.9rem !important;
      margin: 10px 0 !important;
    }

    .swal2-confirm {
      background: linear-gradient(45deg, #ff6b6b, #ee5a52) !important;
      border-radius: 25px !important;
      padding: 10px 25px !important;
      font-weight: bold !important;
      border: none !important;
      font-size: 0.9rem !important;
    }

    .swal2-cancel {
      background: linear-gradient(45deg, #95a5a6, #7f8c8d) !important;
      border-radius: 25px !important;
      padding: 10px 25px !important;
      font-weight: bold !important;
      border: none !important;
      font-size: 0.9rem !important;
    }

    /* SweetAlert responsive */
    @media (max-width: 480px) {
      .swal2-popup {
        width: 280px !important;
        padding: 15px !important;
      }
      
      .swal2-title {
        font-size: 1.1rem !important;
      }
      
      .swal2-html-container {
        font-size: 0.85rem !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 ¡Bienvenidos a mis 15 años! 🎉</h1>
    <p class="subtitle">Captura este momento mágico conmigo ✨</p>

    <button id="startBtn" class="btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24">
        <path d="M12 9a3 3 0 100 6 3 3 0 000-6z"/>
        <path fill-rule="evenodd" d="M9.828 4a3 3 0 012.121.879l.95.95h3.1A2 2 0 0118 7.828v8.344a2 2 0 01-1.999 2h-8.002A2 2 0 016 16.172V7.828A2 2 0 017.828 6h3.1l.95-.95A3 3 0 019.828 4zM12 15a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
      </svg>
      Iniciar Cámara
    </button>

    <div class="camera-selector" id="cameraSelector">
      <button class="camera-btn active" data-facing="user">
        📱 Cámara Frontal
      </button>
      <button class="camera-btn" data-facing="environment">
        📷 Cámara Trasera
      </button>
    </div>

    <video id="video" autoplay playsinline></video>
    
    <button id="captureBtn" class="btn btn-capture" style="display: none;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="white" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="6"/>
      </svg>
      ¡Tomar Foto!
    </button>

    <canvas id="canvas" style="display: none;"></canvas>
    <img id="preview" alt="Foto tomada"/>
    
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Guardando tu foto mágica... ✨</p>
    </div>
  </div>

  <script>
    // Crear burbujas animadas
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      
      const size = Math.random() * 60 + 20;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * window.innerWidth + 'px';
      bubble.style.bottom = '-100px';
      
      const duration = Math.random() * 3 + 3;
      bubble.style.animationDuration = duration + 's';
      
      const delay = Math.random() * 2;
      bubble.style.animationDelay = delay + 's';
      
      document.body.appendChild(bubble);
      
      setTimeout(() => {
        if (bubble.parentNode) {
          bubble.parentNode.removeChild(bubble);
        }
      }, (duration + delay) * 1000);
    }

    // Crear burbujas cada 400ms
    setInterval(createBubble, 400);

    // Variables principales
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const cameraSelector = document.getElementById('cameraSelector');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const loading = document.getElementById('loading');
    
    const urlApi = proccess.env.URL_API;
    
    let currentStream = null;
    let currentFacing = 'user';

    // Configuración de SweetAlert más pequeña
    const swalConfig = {
      width: 320,
      padding: '20px',
      background: 'rgba(255, 255, 255, 0.95)',
      backdrop: 'rgba(0, 0, 0, 0.4)',
      confirmButtonColor: '#ff6b6b',
      cancelButtonColor: '#95a5a6'
    };

    // Iniciar cámara
    async function startCamera(facingMode = 'user') {
      try {
        // Detener stream anterior si existe
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: facingMode },
            width: { ideal: 1200 },
            height: { ideal: 800 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';
        startBtn.style.display = 'none';
        captureBtn.style.display = 'flex';
        cameraSelector.style.display = 'flex';
        currentFacing = facingMode;

        // Actualizar botones activos
        document.querySelectorAll('.camera-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.facing === facingMode);
        });

      } catch (err) {
        console.error('Error al iniciar cámara:', err);
        
        let errorMessage = "No se pudo acceder a la cámara";
        if (err.name === 'NotAllowedError') {
          errorMessage = "Permite el acceso a la cámara para continuar";
        } else if (err.name === 'NotFoundError') {
          errorMessage = "No se encontró cámara en tu dispositivo";
        }

        await Swal.fire({
          ...swalConfig,
          title: "Error de cámara",
          text: errorMessage,
          icon: 'error',
          confirmButtonText: 'Entendido'
        });
      }
    }

    // Tomar foto
    async function takePhoto() {
      try {
        // Mostrar alerta de confirmación más pequeña
        const result = await Swal.fire({
          ...swalConfig,
          title: '📸 ¡Sonríe!',
          text: '¿Lista para tomar la foto?',
          icon: 'question',
          showCancelButton: true,
          confirmButtonText: '¡Sí! ✨',
          cancelButtonText: 'Espera'
        });

        if (!result.isConfirmed) return;

        console.log('📷 Tomando foto...');
        
        // Tomar la foto
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        preview.src = dataUrl;
        preview.style.display = 'block';

        // Detener cámara
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        video.style.display = 'none';
        captureBtn.style.display = 'none';
        cameraSelector.style.display = 'none';
        startBtn.style.display = 'flex';

        // Mostrar loading para subida
        loading.style.display = 'block';

        // Alerta de guardado
        Swal.fire({
          ...swalConfig,
          title: 'Guardando...',
          html: 'Tu foto se está guardando ✨',
          allowOutsideClick: false,
          showConfirmButton: false,
          didOpen: () => {
            Swal.showLoading();
          }
        });

        console.log('📤 Enviando imagen al servidor...');

        // Enviar al backend
        const response = await fetch(urlApi, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image: dataUrl })
        });

        loading.style.display = 'none';

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log('✅ Respuesta exitosa:', data);

        if (data.success) {
          await Swal.fire({
            ...swalConfig,
            title: '🎉 ¡Perfecto!',
            text: 'Tu foto se guardó exitosamente ✨',
            icon: 'success',
            confirmButtonText: '¡Genial! 💖'
          });
        } else {
          throw new Error(data.error || "Error desconocido");
        }

      } catch (err) {
        loading.style.display = 'none';
        captureBtn.style.display = 'none';
        cameraSelector.style.display = 'none';
        startBtn.style.display = 'flex';
        video.style.display = 'none';
        
        // Detener cámara si está activa
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        console.error('❌ Error:', err);
        
        let errorMessage = "Hubo un problema al guardar";
        if (err.message.includes('HTTP')) {
          errorMessage = "Error de conexión. Revisa tu internet";
        }

        await Swal.fire({
          ...swalConfig,
          title: "Error",
          text: errorMessage,
          icon: 'error',
          confirmButtonText: 'Entendido'
        });
      }
    }

    // Event listeners
    startBtn.addEventListener('click', async () => {
      const result = await Swal.fire({
        ...swalConfig,
        title: '📸 ¡Hora de brillar!',
        text: '¿Lista para la sesión de fotos?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '¡Vamos! ✨',
        cancelButtonText: 'Después'
      });

      if (result.isConfirmed) {
        await startCamera(currentFacing);
      }
    });

    captureBtn.addEventListener('click', takePhoto);

    // Selector de cámara
    document.querySelectorAll('.camera-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const facing = btn.dataset.facing;
        if (facing !== currentFacing) {
          startCamera(facing);
        }
      });
    });

    // Efectos de hover
    startBtn.addEventListener('mouseenter', () => {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => createBubble(), i * 200);
      }
    });

    captureBtn.addEventListener('mouseenter', () => {
      for (let i = 0; i < 2; i++) {
        setTimeout(() => createBubble(), i * 150);
      }
    });
  </script>
</body>
</html>
